name: qent_app
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.5.0


dependencies:
  flutter:
    sdk: flutter



  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  flutter_screenutil: ^5.9.3
  country_code_picker: ^3.0.0
  flutter_otp_text_field: ^1.5.0
  shared_preferences: ^2.5.3
  dio: ^5.9.1
  pretty_dio_logger: ^1.4.0
  internet_connection_checker_plus: ^2.7.2
  connectivity_plus: ^6.1.0
  device_info_plus: ^11.3.0
  intl: ^0.19.0
  equatable: ^2.0.8
  dartz: ^0.10.1
  get_it: ^9.2.0
  flutter_bloc: ^9.1.1
  syncfusion_flutter_datepicker: ^27.1.48


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/


  fonts:
  - family: Roboto
    fonts:
    - asset: assets/fonts/roboto/Roboto-Bold.ttf
      weight: 700
    - asset: assets/fonts/roboto/Roboto-Regular.ttf
      weight: 400
    - asset: assets/fonts/roboto/Roboto-SemiBold.ttf
      weight: 600


# Flutter Native Splash configuration
flutter_native_splash:


  # Color or image to set as background
  color: "#000000"  # Black background
  image: assets/images/splash_logo.png
  

  
